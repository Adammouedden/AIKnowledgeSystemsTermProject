[workspace]
name = "credit-assignment"
version = "0.1.0"
description = "GACA vs GRPO reproduction on ALFWorld with a small Qwen2.5 backbone"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu128" }
transformers = ">=4.51"
trl = ">=0.19"
peft = ">=0.14"
accelerate = ">=1.4"
datasets = ">=3.0"
alfworld = "*"
numpy = "<2.3"
matplotlib = ">=3.8"

[activation.env]
HF_HOME = "/home/adamant/SCHOOL/CreditAssignment/models"
ALFWORLD_DATA = "/home/adamant/SCHOOL/CreditAssignment/data/alfworld"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TOKENIZERS_PARALLELISM = "false"

[tasks]
test = "python src/test_advantages.py"
test-train = "python src/test_train.py"
train = "python src/train.py"
report = "python src/report.py"
